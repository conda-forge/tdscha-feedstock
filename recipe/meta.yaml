{% set name = "tdscha" %}
{% set version = "1.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/tdscha-{{ version }}.tar.gz
  sha256: eea0a294a4489362d6f69fb415e2c07d575ee6e728c797d795e81f9a7b4a01bc

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  skip: true  # [not linux]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    - cmake
    - pkg-config
  host:
    - python
    - mpi4py
    - pypar
    - numpy
    - pip
    - meson-python
    - libblas
    - liblapack
  run:
    - python
    - ase
    - scipy
    - cellconstructor
    - python-sscha
    - {{ pin_compatible('numpy') }}

test:
  imports:
    - tdscha
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/SSCHAcode/tdscha
  summary: Time Dependent Self Consistent Harmonic Approximation
  license: GPL-3.0-or-later
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - jan-janssen
