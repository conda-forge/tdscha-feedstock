schema_version: 1

context:
  name: tdscha
  version: "1.6.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/tdscha-${{ version }}.tar.gz
  sha256: d45ef880d294ef9f358b4d040cc98677f0bd7d0627dc02dc4c0932931b9b7b35

build:
  number: 0
  skip: not linux
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
    - cmake
    - pkg-config
  host:
    - python
    - mpi4py
    - pypar
    - numpy
    - pip
    - meson-python
    - libblas
    - liblapack
  run:
    - python
    - ase
    - scipy
    - cellconstructor
    - python-sscha
    - ${{ pin_compatible('numpy') }}

tests:
  - python:
      imports:
        - tdscha
      pip_check: true

about:
  summary: Time Dependent Self Consistent Harmonic Approximation
  license: GPL-3.0-or-later
  license_file: LICENSE.txt
  homepage: https://github.com/SSCHAcode/tdscha

extra:
  recipe-maintainers:
    - jan-janssen
